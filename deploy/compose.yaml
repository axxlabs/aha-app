# The Aha! app's server (SPEC §7.4): Caddy serving the current release that deploy/update.sh built.
services:
  caddy:
    image: docker.io/library/caddy@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b  # caddy:2, pinned (SPEC §9.2)
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { AHA_SITES: "${AHA_SITES}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, /srv/aha-app:/srv:ro, caddy:/data, caddy-config:/config]
volumes:
  caddy: {}
  caddy-config: {}
